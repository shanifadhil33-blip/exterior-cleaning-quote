name: GitHub Pages backup
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: cd wip && sh build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wip/dist
      - id: deployment
        uses: actions/deploy-pages@v4
